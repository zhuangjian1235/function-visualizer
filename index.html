<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>函数可视化</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="app">
  <div class="col-left panel"></div>
  <div class="col-center panel">
    <div class="canvas-host"><canvas></canvas></div>
  </div>
  <div class="col-right panel"></div>
  <div class="col-transform"></div>
  <div class="mob-tabs">
    <button data-view="left" class="active">函数</button>
    <button data-view="right">分析</button>
    <button data-view="transform">变换</button>
  </div>
</div>
<script src="vendor/mathjs/math.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script>
// 开发形态：按依赖顺序加载模块（与打包器同序）
const SCRIPTS = [
  'src/00-util.js','src/10-frontend.js','src/11-math.js',
  'src/20-render.js','src/21-render3d.js','src/22-touch.js','src/30-store.js','src/31-analysis.js','src/40-ui.js','src/99-main.js'
];
(function load(i){
  if(i>=SCRIPTS.length) return;
  const s = document.createElement('script');
  s.src = SCRIPTS[i];
  s.onload = () => load(i+1);
  document.head.appendChild(s);
})(0);
</script>
</body>
</html>
